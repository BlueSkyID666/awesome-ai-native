name: Radar

on:
  schedule:
    - cron: "17 2 * * *" # daily, off the whole-hour peak
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh arXiv radar
        run: python scripts/radar.py

      - name: Commit and push if changed
        run: |
          git config user.name "radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/radar.md
          if git diff --cached --quiet; then
            echo "No radar changes to commit"
            exit 0
          fi
          git commit -m "chore(radar): refresh arXiv radar ($(date -u +%F))"
          git push
